name: AEO weekly run

on:
  workflow_dispatch: {}    # manual only. The weekly schedule was retired with the monitor;
                           # restore `schedule: [{cron: "0 9 * * 1"}]` to run it again.

# The default GITHUB_TOKEN needs write access to push the appended data + page.
permissions:
  contents: write

# Never let two weekly runs race on the committed aeo.db.
concurrency:
  group: aeo-weekly
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Keys come ONLY from repo secrets — never committed, auto-masked in logs.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -m aeo.cli run

      - name: Regenerate dashboard
        run: python3 -m aeo.report_html

      - name: Commit appended data + regenerated page
        run: |
          git config user.name "aeo-bot"
          git config user.email "aeo-bot@users.noreply.github.com"
          git add aeo.db public/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "AEO run $(date -u +%FT%TZ)"
            git push
          fi
