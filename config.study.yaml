# STUDY config — a category survey, not a brand monitor.
#
# Two differences from config.yaml that matter:
#
#   1. `brands:` is a FLAT list. No privileged centre. In the monitor,
#      Flatiron is "the brand" and everyone else is "a competitor", which is
#      correct for monitoring and wrong for a study. Here all ten are peers,
#      and nothing in the analysis treats one differently.
#
#   2. The prompts are neutral. Only three of the thirty name a brand, and
#      those three are deliberate head-to-head comparisons. The monitor set
#      named Flatiron in 17 of 35 prompts, which manufactured its mention rate.
#
# DISCLOSURE: Flatiron School is included and the author formerly worked
# there. State this in the published methodology. Leaving them out would be
# conspicuous in a category this small; including them silently would be worse.
#
# Separate database file so the study never mixes with the monitor's history.

database: aeo_study.db
runs_per_prompt: 3        # 30 prompts x 4 engines x 3 = 360 answers
engines: [anthropic, openai, perplexity, gemini]

sentiment:
  enabled: false          # off: thousands of extra calls, answers no study question

brands:
- name: Flatiron School
  domains:
  - flatironschool.com
  aliases:
  - Flatiron School
  - Flatiron
- name: General Assembly
  domains:
  - generalassemb.ly
  - generalassembly.com
  aliases:
  - General Assembly
- name: Springboard
